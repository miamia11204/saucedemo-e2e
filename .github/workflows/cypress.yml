name: Cypress E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cy-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          browser: chrome

      - name: Save test screenshots and videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: saucedemo-test-artifacts
          path: |
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: ignore
          retention-days: 7
